<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}My Shop{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container d-flex justify-content-between align-items-center">     ">
            <a class="navbar-brand text-white text-decoration-none" href="/">My Shop</a>
            <form class="d-flex" method="get" action="{% url 'store:product_list' %}">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" name="q" value="{{ request.GET.q }}">
                <button class="btn btn-outline-light" type="submit">Search</button>
            </form>
            
            <a href="{% url 'cart:cart_detail' %}" class="btn btn-outline-light">
                Cart ({{ cart|length }})
            </a>
            {% if user.is_authenticated %}
            <span class="text-white me-2">Hello, {{ user.username }}</span>

                <a href="{% url 'orders:order_history' %}" class="btn btn-outline-light me-2">Order History</a>
                <a href="{% url 'accounts:logout' %}" class="btn btn-outline-light">Logout</a>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="btn btn-outline-light me-2">Login</a>
                <a href="{% url 'accounts:signup' %}" class="btn btn-outline-light">Sign Up</a>
            {% endif %}

        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
